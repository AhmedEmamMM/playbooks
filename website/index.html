<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playbooks</title>
  <meta name="description" content="My personal library of steps and prompts: actions to follow, prompts to copy, links to open." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F2430'/%3E%3Cpath d='M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z' fill='%23fff'/%3E%3C/svg%3E" />

  <!-- Fonts load when online; offline the system font stack in theme.css is used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/app.css" />

  <!-- Applies the saved look before the page draws (no flash). -->
  <script src="js/appearance.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html" aria-label="Playbooks home">
      <span class="brand__mark"><i data-icon="sparkles"></i></span>
      <span>Playbooks</span>
    </a>

    <label class="search">
      <i data-icon="search"></i>
      <span class="sr-only">Search</span>
      <input type="search" data-search placeholder="Search steps, prompts and collections…" autocomplete="off" spellcheck="false" />
      <button type="button" class="search__clear" data-search-clear aria-label="Clear search" hidden><i data-icon="x"></i></button>
      <kbd aria-hidden="true">/</kbd>
    </label>

    <div class="top__menu">
      <button type="button" class="btn btn--icon" data-topmenu-btn aria-haspopup="menu" aria-expanded="false" aria-label="More options"><i data-icon="ellipsis-vertical"></i></button>
      <div class="menu" data-topmenu role="menu" hidden>
        <button type="button" role="menuitem" data-action="appearance"><i data-icon="sliders-horizontal"></i>Appearance…</button>
        <hr />
        <button type="button" role="menuitem" data-action="export"><i data-icon="download"></i>Export backup (.json)</button>
        <button type="button" role="menuitem" data-action="import"><i data-icon="upload"></i>Import backup (.json)</button>
      </div>
    </div>

    <button type="button" class="btn btn--primary" data-top-newcoll><i data-icon="plus"></i><span>New collection</span></button>
    <input type="file" accept="application/json,.json" data-import-file hidden />
  </header>

  <div class="app" data-root>
    <noscript><div class="empty"><b>JavaScript is off</b>Playbooks needs JavaScript to show your steps. Turn it on for this file and reload.</div></noscript>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/store.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/step-modal.js"></script>
  <script src="js/collection-modal.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
